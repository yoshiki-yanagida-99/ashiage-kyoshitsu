<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>あしあげ教室</title>
<style>
  html,body{margin:0;height:100%;background:#2a1a40;overflow:hidden;touch-action:none;
    user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;
    font-family:"Hiragino Maru Gothic ProN","Hiragino Sans","Yu Gothic UI","Meiryo",sans-serif}
  #app{position:fixed;inset:0;display:flex;flex-direction:column}
  #stage{flex:1;position:relative;min-height:0}
  canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
  #pads{display:flex;gap:12px;padding:12px 16px calc(12px + env(safe-area-inset-bottom));background:#2a1a40}
  .pad{flex:1;height:110px;border:0;border-radius:24px;font:inherit;color:#fff;cursor:pointer;
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;
    box-shadow:0 7px 0 rgba(0,0,0,.35);transition:transform .05s,box-shadow .05s,filter .05s;
    -webkit-tap-highlight-color:transparent;touch-action:none}
  .pad .big{font-size:30px;font-weight:800;letter-spacing:.05em;text-shadow:0 2px 0 rgba(0,0,0,.25)}
  .pad .key{font-size:13px;opacity:.8}
  #padL{background:#3fa9f5}
  #padR{background:#ff7a45}
  .pad.on{transform:translateY(6px);box-shadow:0 1px 0 rgba(0,0,0,.35);filter:brightness(1.18)}
  @media (orientation:landscape) and (max-height:540px){
    #pads{position:absolute;inset:0;pointer-events:none;background:none;padding:0}
    .pad{position:absolute;bottom:calc(14px + env(safe-area-inset-bottom));width:21vw;height:52vh;pointer-events:auto;opacity:.88}
    #padL{left:calc(12px + env(safe-area-inset-left))}
    #padR{right:calc(12px + env(safe-area-inset-right))}
  }

  .overlay{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
    background:rgba(30,15,50,.62);overflow:auto;padding:16px;box-sizing:border-box;z-index:5}
  .overlay.hidden{display:none}
  .card{background:#fff8e6;border:4px solid #3a2a2a;border-radius:26px;padding:20px 22px;max-width:540px;width:100%;
    box-sizing:border-box;text-align:center;color:#3a2a2a;box-shadow:0 10px 0 rgba(0,0,0,.3);margin:auto}
  .logo{font-size:44px;font-weight:900;line-height:1.05;color:#e8473b;letter-spacing:.06em;
    text-shadow:3px 3px 0 #ffd23f,5px 5px 0 #3a2a2a}
  .lead{margin:12px 0 10px;font-size:16px}
  .legend{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:8px 0}
  .legend button{font:inherit;font-size:15px;font-weight:700;color:#3a2a2a;background:#fff;border:3px solid #3a2a2a;
    border-radius:14px;padding:8px 6px;display:flex;align-items:center;gap:8px;text-align:left;cursor:pointer}
  .legend small{display:block;font-weight:400;font-size:11px;opacity:.75}
  .legend button.wide{grid-column:1/-1}
  .ic{flex:none;width:34px;height:34px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;
    color:#fff;font-style:normal;font-weight:900;border:3px solid #3a2a2a}
  .ic.L{background:#3fa9f5}.ic.R{background:#ff7a45}.ic.B{background:#b06cff}.ic.F{background:#9a9a9a}.ic.S{background:#33364a}
  .hint{font-size:12px;opacity:.7;margin:4px 0 12px}
  .levels{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
  .lv{font:inherit;color:#fff;border:4px solid #3a2a2a;border-radius:18px;padding:10px 4px;cursor:pointer;
    box-shadow:0 6px 0 #3a2a2a;display:flex;flex-direction:column;align-items:center;gap:2px}
  .lv:active{transform:translateY(4px);box-shadow:0 2px 0 #3a2a2a}
  .lv b{font-size:20px;font-weight:900}
  .lv small{font-size:11px;opacity:.9}
  .lv .best{font-size:11px;font-weight:700;min-height:1em}
  .lv[data-level=easy]{background:#3ccf6e}
  .lv[data-level=normal]{background:#ff9f1c}
  .lv[data-level=hard]{background:#e8473b}
  .go{font:inherit;font-size:24px;font-weight:900;color:#fff;background:#e8473b;border:4px solid #3a2a2a;border-radius:999px;
    padding:10px 46px;cursor:pointer;box-shadow:0 6px 0 #3a2a2a}
  .go:active{transform:translateY(4px);box-shadow:0 2px 0 #3a2a2a}
  .sub{font:inherit;font-size:15px;background:none;border:0;color:#3a2a2a;text-decoration:underline;margin-top:10px;cursor:pointer;display:block;margin-inline:auto}
  .offset{display:flex;align-items:center;justify-content:center;gap:8px;font-size:12px;margin-top:14px;opacity:.85}
  .offset input{width:140px}
  .lvname{font-size:14px;font-weight:700;opacity:.7}
  .rank{font-size:34px;font-weight:900;color:#e8473b;text-shadow:2px 2px 0 #ffd23f}
  .pct{font-size:56px;font-weight:900;line-height:1.1}
  .pct small{font-size:24px}
  .newbest{color:#e8473b;font-weight:900;font-size:14px;min-height:1em}
  .stats{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin:12px 0 16px;font-size:12px}
  .stats div{background:#fff;border:3px solid #3a2a2a;border-radius:12px;padding:6px 2px}
  .stats b{display:block;font-size:22px}
  @media (max-height:540px){
    .card{padding:12px 16px}
    .logo{font-size:30px}
    .logo br{display:none}
    .legend{grid-template-columns:repeat(5,1fr)}
    .legend button{flex-direction:column;text-align:center;font-size:13px;gap:4px}
    .legend button.wide{grid-column:auto}
    .lead{margin:6px 0}
    .pct{font-size:40px}
  }
</style>
</head>
<body>
<div id="app">
  <div id="stage"><canvas id="cv"></canvas></div>
  <div id="pads">
    <button class="pad" id="padL" data-side="L"><span class="big">左足</span><span class="key">F / ←</span></button>
    <button class="pad" id="padR" data-side="R"><span class="big">右足</span><span class="key">J / →</span></button>
  </div>

  <div class="overlay" id="title">
    <div class="card">
      <div class="logo">あしあげ<br>教室</div>
      <p class="lead">せんせいのお手本を、<b>1小節あと</b>にマネしよう！<br>タップするたびに、足を棚に<b>のせる／おろす</b>。</p>
      <div class="legend">
        <button data-cue="L"><i class="ic L">左</i><span>ひだり<small>左足（F / ←）</small></span></button>
        <button data-cue="R"><i class="ic R">右</i><span>みぎ<small>右足（J / →）</small></span></button>
        <button data-cue="B"><i class="ic B">両</i><span>りょうあし<small>左右同時（Space）</small></span></button>
        <button data-cue="F"><i class="ic F">〜</i><span>ぷるぷる<small>フェイント！押さない</small></span></button>
        <button data-cue="S" class="wide"><i class="ic S">脱</i><span>くつポイ／はく<small>同じ足をトトンとすばやく2回。もう一度やると靴をはく</small></span></button>
      </div>
      <p class="hint">アイコンを押すと合図の音が聞けます</p>
      <div class="levels">
        <button class="lv" data-level="easy"><b>かんたん</b><small>ゆっくり・靴なし</small><span class="best" id="best-easy"></span></button>
        <button class="lv" data-level="normal"><b>ふつう</b><small>靴ポイあり</small><span class="best" id="best-normal"></span></button>
        <button class="lv" data-level="hard"><b>むずかしい</b><small>速い・動き多め</small><span class="best" id="best-hard"></span></button>
      </div>
      <label class="offset">タイミング調整 早<input type="range" id="offset" min="-150" max="150" step="10" value="0">遅 <span id="offsetVal">0ms</span></label>
    </div>
  </div>

  <div class="overlay hidden" id="result">
    <div class="card">
      <div class="lvname" id="lvname"></div>
      <div class="rank" id="rank"></div>
      <div class="pct"><span id="pct"></span><small>点</small></div>
      <div class="newbest" id="newbest"></div>
      <p id="comment"></p>
      <div class="stats">
        <div>Perfect<b id="sP">0</b></div>
        <div>Good<b id="sG">0</b></div>
        <div>Miss<b id="sM">0</b></div>
        <div>よけい<b id="sX">0</b></div>
      </div>
      <button class="go" id="againBtn">もう一回</button>
      <button class="sub" id="backBtn">タイトルへ</button>
    </div>
  </div>
</div>

<script>
'use strict';
const $ = id => document.getElementById(id);

// ---------- 難易度と譜面 ----------
// 1小節 = 8分音符 8つ。
// L/R = その足を棚にのせる／おろす（いまの位置から切り替え）  B = 両足いっしょに
// l/r = その足をトトンと16分で2回（はいていれば靴をポイ、脱いでいればはく）
// F = フェイント（ぷるぷるするだけ）  . = 休み
const LEVELS = {
  easy: {
    name: 'かんたん', bpm: 96,
    sections: { 0: 'レッスン1　まずは基本！', 8: 'レッスン2　ぷるぷるはガマン！' },
    patterns: [
      'L...L...', 'R...R...', 'L...R...', 'B.......', 'B...B...', 'L.R.B...', 'R.L.B...', 'L.L.R.R.',
      'L.F.L...', 'F...B...', 'B.F.....', 'R.F.R...', 'L.R.F...', 'F.L.R...', 'B.F.B...', 'L.R.L.R.',
    ],
  },
  normal: {
    name: 'ふつう', bpm: 112,
    sections: {
      0: 'レッスン1　まずは基本！', 6: 'レッスン2　ぷるぷるはガマン！',
      12: 'レッスン3　くつをポイ！（トトンと2回）', 19: 'レッスン4　ぜんぶまぜて！',
    },
    patterns: [
      'L...L...', 'R...R...', 'L...R...', 'B.......', 'L.R.B...', 'B...B...',
      'L.F.L...', 'F...B...', 'B.F.....', 'R.L.F...', 'F.R.L...', 'B.F.B...',
      'l...L.L.', 'R.R.r...', 'B...B...', 'l.r.....', 'L...l...', 'R...B...', 'L.l.L...',
      'LR..B...', 'L.RL..R.', 'r.L.R.B.', 'F.LR.FB.', 'LRLR..r.',
    ],
  },
  hard: {
    name: 'むずかしい', bpm: 132,
    sections: { 0: 'レッスン1　ウォーミングアップ！', 8: 'レッスン2　くつもいそがしい！', 16: 'レッスン3　フィーバー！' },
    patterns: [
      'LR..LR..', 'L.R.LR..', 'B.B.LRRL', 'RL.RL.B.', 'B.L.R...', 'F.B.F...', 'LL.RR.B.', 'B.......',
      'l.L.L.r.', 'R.Rl..B.', 'r..B.l..', 'LRl.B...', 'F.l.r.F.', 'B.B.B.B.', 'l.r.LR..', 'B.F.....',
      'LRLRB.B.', 'L.RLR.B.', 'B.LR.RL.', 'r.RR.l.B', 'B..lr.F.', 'LRB.RLB.', 'F.LRLR.F', 'LR.B.BRL',
    ],
  },
};
let BPM, BEAT, BAR, STEP, SLOT;
function setTempo(bpm) { BPM = bpm; BEAT = 60 / bpm; BAR = BEAT * 4; STEP = BAR / 16; SLOT = BAR / 8; }
setTempo(112);
const PERFECT = 0.055, GOOD = 0.115;

const COLORS = { L: '#3fa9f5', R: '#ff7a45', B: '#b06cff', F: '#9a9a9a' };
const ICON = { L: '左', R: '右', B: '両', F: '〜' };
const SIDE_NAME = { L: 'ひだり', R: 'みぎ', B: 'りょうあし' };
function cueLabel(ev) {
  if (ev.type === 'F') return { text: 'ぷるぷる…', color: COLORS.F };
  if (ev.type === 'S') return { text: SIDE_NAME[ev.side] + (ev.act === 'off' ? 'ポイ！' : 'はく！'), color: COLORS[ev.side] };
  return { text: SIDE_NAME[ev.type] + (ev.dir === 'up' ? 'アップ！' : 'ダウン！'), color: COLORS[ev.type] };
}

// ---------- オーディオ ----------
let ac = null, master, musicBus, cueBus, noiseBuf;
function initAudio() {
  if (ac) return;
  ac = new (window.AudioContext || window.webkitAudioContext)({ latencyHint: 'interactive' });
  const comp = ac.createDynamicsCompressor();
  comp.threshold.value = -14; comp.ratio.value = 4;
  comp.connect(ac.destination);
  master = ac.createGain(); master.gain.value = 0.9; master.connect(comp);
  musicBus = ac.createGain(); musicBus.gain.value = 0.5; musicBus.connect(master);
  cueBus = ac.createGain(); cueBus.gain.value = 1.0; cueBus.connect(master);
  noiseBuf = ac.createBuffer(1, ac.sampleRate * 2, ac.sampleRate);
  const d = noiseBuf.getChannelData(0);
  for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
}
const mtof = m => 440 * Math.pow(2, (m - 69) / 12);
function gn(dest, v = 0) { const g = ac.createGain(); g.gain.value = v; g.connect(dest); return g; }
function env(g, t, a, peak, d) {
  g.gain.setValueAtTime(0.0001, t);
  g.gain.exponentialRampToValueAtTime(peak, t + a);
  g.gain.exponentialRampToValueAtTime(0.0001, t + a + d);
}
function osc(type, f, t, dur, dest) {
  const o = ac.createOscillator(); o.type = type; o.frequency.setValueAtTime(f, t);
  o.connect(dest); o.start(t); o.stop(t + dur + 0.05); return o;
}
function filt(type, f, q, dest) {
  const b = ac.createBiquadFilter(); b.type = type; b.frequency.value = f; b.Q.value = q; b.connect(dest); return b;
}
function noise(t, dur, dest) {
  const s = ac.createBufferSource(); s.buffer = noiseBuf; s.connect(dest);
  s.start(t, Math.random() * 1.0); s.stop(t + dur); return s;
}

function kick(t, v) {
  const g = gn(musicBus); env(g, t, 0.002, v, 0.32);
  const o = osc('sine', 150, t, 0.4, g); o.frequency.exponentialRampToValueAtTime(42, t + 0.13);
}
function snare(t, v) {
  const g = gn(musicBus); env(g, t, 0.001, 0.5 * v, 0.16);
  noise(t, 0.2, filt('highpass', 1500, 0.7, g));
  const g2 = gn(musicBus); env(g2, t, 0.001, 0.35 * v, 0.07);
  osc('triangle', 200, t, 0.1, g2);
}
function hat(t, v, open) {
  const g = gn(musicBus); env(g, t, 0.001, 0.13 * v, open ? 0.22 : 0.035);
  noise(t, open ? 0.3 : 0.06, filt('highpass', 7500, 0.7, g));
}
function crash(t) {
  const g = gn(musicBus); env(g, t, 0.002, 0.22, 1.4);
  noise(t, 1.6, filt('highpass', 5000, 0.7, g));
}
function bass(t, m, d) {
  const g = gn(musicBus);
  g.gain.setValueAtTime(0.0001, t);
  g.gain.exponentialRampToValueAtTime(0.32, t + 0.006);
  g.gain.exponentialRampToValueAtTime(0.12, t + d);
  g.gain.exponentialRampToValueAtTime(0.0001, t + d + 0.05);
  const f = filt('lowpass', 1600, 6, g);
  f.frequency.setValueAtTime(1600, t);
  f.frequency.exponentialRampToValueAtTime(260, t + Math.max(0.08, d));
  osc('sawtooth', mtof(m), t, d + 0.06, f);
  osc('square', mtof(m) * 1.004, t, d + 0.06, f);
}
function stab(t, notes, v) {
  const g = gn(musicBus); env(g, t, 0.003, 0.09 * v, 0.11);
  const f = filt('bandpass', 2000, 1.2, g);
  for (const m of notes) osc('square', mtof(m), t, 0.15, f);
}
function brass(t, notes, dur) {
  const g = gn(musicBus);
  g.gain.setValueAtTime(0.0001, t);
  g.gain.exponentialRampToValueAtTime(0.12, t + 0.03);
  g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  const f = filt('lowpass', 800, 1, g);
  f.frequency.setValueAtTime(800, t);
  f.frequency.exponentialRampToValueAtTime(3200, t + 0.06);
  f.frequency.exponentialRampToValueAtTime(1000, t + dur);
  for (const m of notes) { osc('sawtooth', mtof(m), t, dur, f); osc('sawtooth', mtof(m) * 1.006, t, dur, f); }
}
function sticks(t) {
  const g = gn(musicBus); env(g, t, 0.001, 0.35, 0.05);
  noise(t, 0.08, filt('bandpass', 2500, 3, g));
  osc('triangle', 1700, t, 0.05, g);
}
// 合図音（お手本と自分の入力で共通）
// 棚にのせる「コン」
function wood(f, t, v = 1) {
  const g = gn(cueBus); env(g, t, 0.001, 0.55 * v, 0.1);
  osc('sine', f, t, 0.14, g);
  const g2 = gn(cueBus); env(g2, t, 0.001, 0.2 * v, 0.03);
  osc('triangle', f * 2.7, t, 0.06, g2);
}
// 床におろす「トン」
function thud(f, t, v = 1) {
  const g = gn(cueBus); env(g, t, 0.001, 0.5 * v, 0.12);
  const o = osc('triangle', f * 0.5, t, 0.16, g); o.frequency.exponentialRampToValueAtTime(f * 0.38, t + 0.1);
  const g2 = gn(cueBus); env(g2, t, 0.001, 0.4 * v, 0.1);
  osc('sine', 110, t, 0.14, g2);
}
// くつ下の「ぺちっ」
function pet(f, t, v = 1) {
  const g = gn(cueBus); env(g, t, 0.001, 0.5 * v, 0.06);
  osc('triangle', f * 0.6, t, 0.09, g);
  const g2 = gn(cueBus); env(g2, t, 0.001, 0.3 * v, 0.03);
  noise(t, 0.05, filt('bandpass', f * 1.5, 2, g2));
}
function clap(t) {
  for (let i = 0; i < 3; i++) {
    const g = gn(cueBus); env(g, t + i * 0.011, 0.001, 0.4, i === 2 ? 0.18 : 0.05);
    noise(t + i * 0.011, 0.25, filt('bandpass', 1400, 1.5, g));
  }
}
function wobble(t) {
  const g = gn(cueBus);
  g.gain.setValueAtTime(0.0001, t);
  g.gain.exponentialRampToValueAtTime(0.3, t + 0.02);
  g.gain.exponentialRampToValueAtTime(0.0001, t + 0.32);
  const o = osc('sine', 300, t, 0.32, g);
  o.frequency.linearRampToValueAtTime(190, t + 0.3);
  const lfo = ac.createOscillator(); lfo.frequency.value = 22;
  const lg = gn(o.frequency, 40); lfo.connect(lg); lfo.start(t); lfo.stop(t + 0.36);
}
function bonk(t) {
  const g = gn(cueBus); env(g, t, 0.002, 0.25, 0.16);
  const o = osc('square', 140, t, 0.2, filt('lowpass', 700, 1, g));
  o.frequency.exponentialRampToValueAtTime(60, t + 0.15);
}
// 靴が飛ぶ「スポーン」
function shoePop(t) {
  const g = gn(cueBus); env(g, t, 0.003, 0.35, 0.16);
  const o = osc('sine', 380, t, 0.2, g); o.frequency.exponentialRampToValueAtTime(1500, t + 0.12);
}
// 靴をはく「キュッ」
function squeak(t) {
  const g = gn(cueBus); env(g, t, 0.003, 0.18, 0.09);
  const o = osc('square', 1900, t, 0.12, filt('bandpass', 1600, 3, g)); o.frequency.exponentialRampToValueAtTime(1100, t + 0.09);
}
const L_HZ = 587, R_HZ = 880;
function footSound(side, dir, bare, t, v = 1) {
  const f = side === 'L' ? L_HZ : R_HZ;
  if (dir === 'up') bare ? pet(f, t, v) : wood(f, t, v);
  else bare ? pet(f * 0.7, t, v * 0.9) : thud(f, t, v);
}
function cue(ev, t) {
  const b = ev.bare;
  if (ev.type === 'L' || ev.type === 'R') footSound(ev.type, ev.dir, b[ev.type], t);
  else if (ev.type === 'B') { footSound('L', ev.dir, b.L, t, 0.7); footSound('R', ev.dir, b.R, t, 0.7); clap(t); }
  else if (ev.type === 'F') wobble(t);
  else if (ev.type === 'S') {
    footSound(ev.side, 'up', b[ev.side], t); footSound(ev.side, 'up', b[ev.side], t + STEP);
    (ev.act === 'off' ? shoePop : squeak)(t + STEP);
  }
}

// ---------- 曲（ファンク Em7 / A7 の2小節ループ） ----------
const BASS_EM = [[0,40,2],[3,40,1],[4,52,1],[6,40,1],[8,43,2],[10,45,1],[11,47,1],[12,50,1],[14,52,1],[15,50,1]];
const BASS_A7 = [[0,45,2],[3,45,1],[4,57,1],[6,45,1],[8,49,2],[10,52,1],[11,54,1],[12,55,1],[14,52,1],[15,47,1]];
const STAB_EM = [67, 71, 74], STAB_A7 = [61, 67, 71];
const KICKS = [[0, 3, 8, 10], [0, 6, 8, 11]];

function playStep(bi, st, t) {
  const bar = game.bars[bi], k = bar.kind, alt = bi % 2;
  if (k === 'outro') {
    if (st === 0) { kick(t, 1); crash(t); brass(t, [52, 59, 64, 67, 71, 74], BAR * 1.5); }
    return;
  }
  if (KICKS[alt].includes(st)) kick(t, 1);
  if (st === 4 || st === 12) snare(t, 1);
  else if (k !== 'intro' && (st === 7 || (alt && st === 15) || (!alt && st === 9))) snare(t, 0.18);
  hat(t, st % 4 === 2 ? 0.9 : st % 2 === 0 ? 0.6 : 0.35, alt && st === 14);
  for (const n of (alt ? BASS_A7 : BASS_EM)) if (n[0] === st) bass(t, n[1], n[2] * STEP * 0.9);
  if (k !== 'intro' && [2, 6, 10, 13].includes(st)) stab(t, alt ? STAB_A7 : STAB_EM, 1);
  if (k === 'count' && st % 4 === 0) sticks(t);
  if (bar.section != null && st === 0) { crash(t); brass(t, [64, 67, 71, 74], 0.35); }
  if (k === 'end' && (st === 0 || st === 6 || st === 12)) brass(t, [64, 67, 71, 74], st === 12 ? 0.6 : 0.2);
  if (k === 'call' && st % 2 === 0) { const ev = bar.ev[st / 2]; if (ev) cue(ev, t); }
}

// ---------- ゲーム状態 ----------
let game = null, schedTimer = null, lastLevel = 'normal';
let offsetMs = 0;
try { offsetMs = +localStorage.getItem('ashiage-offset') || 0; } catch (e) {}
$('offset').value = offsetMs; $('offsetVal').textContent = offsetMs + 'ms';
$('offset').addEventListener('input', e => {
  offsetMs = +e.target.value; $('offsetVal').textContent = offsetMs + 'ms';
  try { localStorage.setItem('ashiage-offset', offsetMs); } catch (err) {}
});
function getBest(level) { try { return +localStorage.getItem('ashiage-best-' + level) || 0; } catch (e) { return 0; } }
function showBests() { for (const k in LEVELS) { const b = getBest(k); $('best-' + k).textContent = b ? 'ベスト ' + b + '点' : ''; } }
showBests();

function buildGame(level) {
  const lv = LEVELS[level];
  setTempo(lv.bpm);
  const bars = [{ kind: 'intro' }, { kind: 'count' }];
  // 靴（true=はいている）と足の位置（棚の上=up）を追いながら、各合図の意味を決める
  const shoe = { L: true, R: true }, foot = { L: 'down', R: 'down' };
  lv.patterns.forEach((p, i) => {
    const ev = [];
    for (let j = 0; j < 8; j++) {
      const c = p[j]; if (c === '.') continue;
      const bare = { L: !shoe.L, R: !shoe.R };
      if (c === 'l' || c === 'r') {
        const side = c.toUpperCase();
        ev[j] = { type: 'S', side, act: shoe[side] ? 'off' : 'on', bare };
        shoe[side] = !shoe[side];
      } else if (c === 'F') ev[j] = { type: 'F', bare };
      else {
        const sides = c === 'B' ? ['L', 'R'] : [c];
        if (c === 'B' && foot.L !== foot.R) console.warn('両足の位置がそろっていない B', level, i, p);
        const dir = foot[sides[0]] === 'down' ? 'up' : 'down';
        for (const sd of sides) foot[sd] = dir;
        ev[j] = { type: c, dir, bare };
      }
    }
    bars.push({ kind: 'call', p, ev, idx: i, section: lv.sections[i] != null ? i : null });
    bars.push({ kind: 'resp', p, ev, idx: i, endShoe: { ...shoe }, endFoot: { ...foot } });
  });
  bars.push({ kind: 'end' }, { kind: 'outro' });
  const t0 = ac.currentTime + 0.4;
  const tEvents = [], tMoves = [], tFlicks = [], tShoe = [], notes = [], msgs = [];
  bars.forEach((b, bi) => {
    const bs = t0 + bi * BAR;
    b.t = bs;
    if (b.kind === 'call') {
      b.ev.forEach((ev, i) => {
        const t = bs + i * SLOT;
        tEvents.push({ t, ev });
        if (ev.type === 'S') {
          tFlicks.push({ t, side: ev.side }, { t: t + STEP, side: ev.side });
          tShoe.push({ t: t + STEP, side: ev.side, act: ev.act });
        } else if (ev.type !== 'F') {
          for (const sd of ev.type === 'B' ? ['L', 'R'] : [ev.type]) tMoves.push({ t, side: sd, to: ev.dir });
        }
      });
      if (b.section != null) msgs.push({ t: bs - BAR, text: lv.sections[b.section] });
    }
    if (b.kind === 'resp') {
      b.notes = [];
      b.ev.forEach((ev, i) => {
        const t = bs + i * SLOT;
        if (ev.type === 'S') {
          const n1 = { t, type: ev.side, slot: i, done: false, res: null, flick: true };
          const n2 = { t: t + STEP, type: ev.side, slot: i, done: false, res: null, flick: true, first: n1, act: ev.act };
          n1.next = n2;
          notes.push(n1, n2); b.notes[i] = n1;
        } else if (ev.type !== 'F') {
          const n = { t, type: ev.type, dir: ev.dir, slot: i, done: false, res: null };
          notes.push(n); b.notes[i] = n;
        }
      });
    }
  });
  const endBar = bars.findIndex(b => b.kind === 'end');
  return {
    state: 'play', level, bars, t0, tEvents, tMoves, tFlicks, tShoe, notes, msgs,
    stepIndex: 0, nextStepTime: t0,
    poseT: t0 + endBar * BAR + BEAT * 3,
    endT: t0 + (bars.length - 1) * BAR + BAR * 1.3,
    foot: { L: 'down', R: 'down' }, move: { L: null, R: null },
    twitch: { L: -9, R: -9 }, flick: { L: -9, R: -9 },
    shoe: { L: true, R: true }, shoeAnim: { L: null, R: null }, lastBi: -1,
    face: { type: 'normal', until: 0 },
    pops: [], perfect: 0, good: 0, miss: 0, extra: 0, combo: 0, maxCombo: 0,
  };
}

function schedule() {
  const g = game; if (!g) return;
  const ahead = ac.currentTime + 0.2;
  while (g.nextStepTime < ahead) {
    const bi = Math.floor(g.stepIndex / 16);
    if (bi >= g.bars.length) break;
    playStep(bi, g.stepIndex % 16, g.nextStepTime);
    g.stepIndex++;
    g.nextStepTime = g.t0 + g.stepIndex * STEP;
  }
}

// 今「聞こえている」音のコンテキスト時刻
function audioNow(perfStamp) {
  const p = perfStamp == null ? performance.now() : perfStamp;
  if (ac.getOutputTimestamp) {
    const ts = ac.getOutputTimestamp();
    if (ts.contextTime > 0 && ts.performanceTime > 0) return ts.contextTime + (p - ts.performanceTime) / 1000;
  }
  return ac.currentTime - (ac.outputLatency || ac.baseLatency || 0) + (p - performance.now()) / 1000;
}

async function startGame(level = lastLevel) {
  lastLevel = level;
  initAudio();
  await ac.resume();
  $('title').classList.add('hidden');
  $('result').classList.add('hidden');
  game = buildGame(level);
  clearInterval(schedTimer);
  schedTimer = setInterval(schedule, 25);
  schedule();
}

function stopGame() {
  clearInterval(schedTimer); schedTimer = null;
  if (game) game.state = 'done';
}

function finish() {
  const g = game;
  stopGame();
  const total = g.notes.length;
  const pct = Math.max(0, Math.min(100, Math.round((g.perfect + g.good * 0.7) / total * 100 - g.extra * 1.5)));
  g.pct = pct;
  let rank, comment;
  if (pct >= 90) { rank = 'あしあげマスター！'; comment = 'せんせいもビックリの脚さばき！'; }
  else if (pct >= 70) { rank = 'なかなかの脚前'; comment = 'いいリズム。まだ上を目指せる！'; }
  else if (pct >= 50) { rank = 'まあまあ'; comment = 'おしい！いま足が棚の上か床か、よく見てみよう。'; }
  else { rank = 'もう一回！'; comment = 'まずは合図の音をよく聞いてみよう。'; }
  const best = getBest(g.level);
  $('newbest').textContent = pct > best ? 'ベスト更新！' : '';
  if (pct > best) { try { localStorage.setItem('ashiage-best-' + g.level, pct); } catch (e) {} }
  showBests();
  $('lvname').textContent = LEVELS[g.level].name;
  $('rank').textContent = rank; $('pct').textContent = pct; $('comment').textContent = comment;
  $('sP').textContent = g.perfect; $('sG').textContent = g.good; $('sM').textContent = g.miss; $('sX').textContent = g.extra;
  $('result').classList.remove('hidden');
}

const POP_X = 540, POP_Y = 86;
function pop(text, color) { game.pops.push({ text, color, x: POP_X, y: POP_Y, at: performance.now() }); }
function setFace(type, dur) { game.face = { type, until: performance.now() + dur * 1000 }; }

function judgeHit(n, d) {
  const g = game;
  n.done = true;
  if (d <= PERFECT) { n.res = 'perfect'; g.perfect++; pop('Perfect!', '#ffcc00'); }
  else { n.res = 'good'; g.good++; pop('Good', '#3ccf6e'); }
  g.combo++; g.maxCombo = Math.max(g.maxCombo, g.combo);
  setFace('happy', 0.35);
}
function judgeMiss(n, label) {
  const g = game;
  n.done = true; n.res = 'miss'; g.miss++; g.combo = 0;
  pop(label, '#ff4d4d');
  setFace('sad', 0.6);
}

function moveFoot(side, to, at) {
  const g = game;
  if (g.foot[side] === to) return;
  g.move[side] = { from: g.foot[side], at };
  g.foot[side] = to;
}

function press(side, stamp) {
  const g = game;
  if (!g || g.state !== 'play') return;
  const now = ac.currentTime, heard = audioNow();
  const t = audioNow(stamp) - offsetMs / 1000;
  // 同じ足の音符を早い順に優先（トトンの2打が近いため）。なければ逆足の音符を探す
  let best = null, wrong = null;
  for (const n of g.notes) {
    if (n.t > t + GOOD) break;
    if (n.done || Math.abs(t - n.t) > GOOD) continue;
    if (n.type === side || (n.type === 'B' && n[side] == null)) { best = n; break; }
    if (n.type !== 'B' && (!wrong || Math.abs(t - n.t) < Math.abs(t - wrong.t))) wrong = n;
  }
  const bare = !g.shoe[side];
  if (best && best.type === 'B') {
    best[side] = t;
    footSound(side, best.dir, bare, now, 0.8);
    moveFoot(side, best.dir, heard);
    if (best.L != null && best.R != null) {
      clap(now);
      judgeHit(best, Math.max(Math.abs(best.L - best.t), Math.abs(best.R - best.t)));
    }
  } else if (best && best.flick) {
    footSound(side, 'up', bare, now);
    g.flick[side] = heard;
    judgeHit(best, Math.abs(t - best.t));
    if (best.first && best.first.res !== 'miss') toggleShoe(side, best.act, now, heard);
  } else if (best) {
    footSound(side, best.dir, bare, now);
    moveFoot(side, best.dir, heard);
    judgeHit(best, Math.abs(t - best.t));
  } else {
    bonk(now);
    g.twitch[side] = heard;
    if (wrong) judgeMiss(wrong, 'ぎゃく！');
    else { g.extra++; g.combo = 0; pop('？', '#ff4d4d'); setFace('sad', 0.4); }
  }
}

function toggleShoe(side, act, now, heard) {
  const g = game;
  g.shoe[side] = act === 'on';
  g.shoeAnim[side] = { act, at: heard };
  (act === 'off' ? shoePop : squeak)(now);
}

const KEYMAP = { KeyF: 'L', KeyD: 'L', ArrowLeft: 'L', KeyJ: 'R', KeyK: 'R', ArrowRight: 'R', Space: 'B' };
const LEVEL_KEYS = { Digit1: 'easy', Digit2: 'normal', Digit3: 'hard' };

const cv = $('cv'), c2 = cv.getContext('2d');
let W = 0, H = 0, DPR = 1;
function resize() {
  const r = cv.getBoundingClientRect();
  DPR = Math.min(2, window.devicePixelRatio || 1);
  W = r.width; H = r.height;
  cv.width = Math.round(W * DPR); cv.height = Math.round(H * DPR);
}
window.addEventListener('resize', resize);
new ResizeObserver(resize).observe(cv);
resize();

const INK = '#3a2a2a', SKIN = '#ffd9b0', SHOE = '#33364a';
const TEACHER_X = 220, PLAYER_X = 520, VIEW_CX = 440;
const MOVE_T = 0.12;
// くるぶしの位置（人物の中心からの相対）。床と棚の上
const ANKLE = { down: { x: 50, y: 342 }, up: { x: 104, y: 236 } };

function rr(x, y, w, h, r) {
  c2.beginPath();
  c2.moveTo(x + r, y); c2.arcTo(x + w, y, x + w, y + h, r); c2.arcTo(x + w, y + h, x, y + h, r);
  c2.arcTo(x, y + h, x, y, r); c2.arcTo(x, y, x + w, y, r); c2.closePath();
}
function fillStroke(fill, lw = 3) { c2.fillStyle = fill; c2.fill(); c2.lineWidth = lw; c2.strokeStyle = INK; c2.stroke(); }
function ellipse(x, y, rx, ry) { c2.beginPath(); c2.ellipse(x, y, rx, ry, 0, 0, Math.PI * 2); }
const lerp = (a, b, k) => a + (b - a) * k;
const bump = (dt, dur, h) => (dt >= 0 && dt < dur ? Math.sin(dt / dur * Math.PI) * h : 0);

// 足の位置（state）と、動き始めの位置・経過時間からくるぶし座標を出す
function anklePos(state, from, k, wiggle) {
  const to = ANKLE[state];
  let x = to.x, y = to.y;
  if (from && from !== state && k < 1) {
    const a = ANKLE[from], e = 1 - (1 - k) * (1 - k);
    x = lerp(a.x, to.x, e); y = lerp(a.y, to.y, e) - Math.sin(e * Math.PI) * 30;
  }
  return { x, y: y - wiggle };
}

// 2関節のIK：膝はいつも前側に曲がる
function knee(Hp, A, l1, l2) {
  const dx = A.x - Hp.x, dy = A.y - Hp.y;
  const d = Math.max(1, Math.min(Math.hypot(dx, dy), l1 + l2 - 0.5));
  const a = Math.atan2(dy, dx);
  const alpha = Math.acos(Math.max(-1, Math.min(1, (l1 * l1 + d * d - l2 * l2) / (2 * l1 * d))));
  return { x: Hp.x + Math.cos(a - alpha) * l1, y: Hp.y + Math.sin(a - alpha) * l1 };
}

function drawShelf(cx) {
  const sx = cx + 95;
  c2.fillStyle = 'rgba(0,0,0,.18)'; ellipse(sx + 42, 362, 52, 7); c2.fill();
  rr(sx, 260, 84, 100, 4); fillStroke('#c27f43');
  rr(sx + 7, 268, 70, 38, 3); fillStroke('#a8682f', 2);
  rr(sx + 7, 314, 70, 38, 3); fillStroke('#a8682f', 2);
  rr(sx + 12, 276, 11, 30, 2); fillStroke('#e8473b', 2);
  rr(sx + 25, 280, 9, 26, 2); fillStroke('#3ccf6e', 2);
  rr(sx + 36, 274, 12, 32, 2); fillStroke('#3fa9f5', 2);
  ellipse(sx + 58, 340, 10, 12); fillStroke('#ffd23f', 2);
  rr(sx - 6, 250, 96, 12, 4); fillStroke('#9a5a28');
}

function drawChair(cx) {
  c2.fillStyle = 'rgba(0,0,0,.18)'; ellipse(cx - 6, 362, 58, 8); c2.fill();
  rr(cx - 52, 166, 13, 118, 5); fillStroke('#9a5a28');
  rr(cx - 46, 284, 9, 76, 3); fillStroke('#7a4520');
  rr(cx + 26, 284, 9, 76, 3); fillStroke('#7a4520');
  rr(cx - 50, 272, 90, 13, 5); fillStroke('#c27f43');
}

function drawFoot(A, bare, accent) {
  if (!bare) {
    rr(A.x - 12, A.y - 6, 40, 18, 8); fillStroke(SHOE);
    rr(A.x - 13, A.y + 9, 42, 7, 3); fillStroke('#fff', 2);
    rr(A.x - 12, A.y - 9, 15, 7, 3); fillStroke(accent, 2);
  } else {
    rr(A.x - 10, A.y - 5, 35, 19, 9); fillStroke('#fff');
    for (const tx of [20, 25]) { ellipse(A.x + tx, A.y - 3, 3.5, 3.5); fillStroke('#fff', 2); }
    rr(A.x - 10, A.y - 9, 15, 8, 3); fillStroke(accent, 2);
  }
}

// 横向きのスニーカー（脱いで床に置いた／飛んでいる靴）
function drawLooseShoe(x, y, rot, accent) {
  c2.save(); c2.translate(x, y); c2.rotate(rot);
  rr(-18, -10, 36, 15, 7); fillStroke(SHOE);
  rr(-19, 3, 38, 6, 3); fillStroke('#fff', 2);
  rr(-18, -12, 13, 6, 3); fillStroke(accent, 2);
  c2.restore();
}

function drawLeg(cx, by, A, pants, shoe, accent, far) {
  const hip = { x: cx - 6 + (far ? -3 : 0), y: 266 + (far ? -3 : 0) };
  const K = knee(hip, A, 58, 76);
  c2.lineCap = 'round'; c2.lineJoin = 'round';
  c2.strokeStyle = INK; c2.lineWidth = 25;
  c2.beginPath(); c2.moveTo(hip.x, hip.y); c2.lineTo(K.x, K.y); c2.lineTo(A.x, A.y); c2.stroke();
  c2.strokeStyle = pants; c2.lineWidth = 19;
  c2.beginPath(); c2.moveTo(hip.x, hip.y); c2.lineTo(K.x, K.y); c2.lineTo(A.x, A.y); c2.stroke();
  const flying = shoe.k < 1;
  drawFoot(A, !shoe.on || (flying && shoe.act === 'on'), accent);
  // 脱いだ靴は棚の向こうの床に。脱ぐ／はく瞬間は弧を描いて飛ぶ
  const fx = cx + (far ? 186 : 204), fy = far ? 350 : 354;
  if (flying) {
    const k = shoe.k, sx = A.x + 8, sy = A.y + 2;
    if (shoe.act === 'off') drawLooseShoe(lerp(sx, fx, k), lerp(sy, fy, k) - Math.sin(k * Math.PI) * 110, k * Math.PI * 3, accent);
    else drawLooseShoe(lerp(fx, sx, k), lerp(fy, sy, k) - Math.sin(k * Math.PI) * 70, -(1 - k) * Math.PI * 2, accent);
  } else if (!shoe.on) drawLooseShoe(fx, fy, 0, accent);
}

// 横向き（右向き）に座った人。手前の脚が右足、奥の脚が左足
function drawPerson(cx, o) {
  const bx = cx + o.shake, by = -o.bounce * 5;
  // せんせい：ベージュのスタンドカラーシャツにグレーのズボン／キミ：青いジャージ
  const suit = o.teacher ? '#dccfb4' : '#2f7de1', suitDark = o.teacher ? '#bfb193' : '#1b4f9c';
  const pants = o.teacher ? '#4b4e58' : suit, pantsDark = o.teacher ? '#383a42' : suitDark;
  drawShelf(cx);
  drawChair(cx);
  const ankle = sd => { const a = o.ankles[sd]; return { x: cx + a.x + (sd === 'L' ? -7 : 0), y: a.y + (sd === 'L' ? -3 : 0) }; };
  drawLeg(cx, by, ankle('L'), pantsDark, o.shoes.L, COLORS.L, true);
  // 奥の腕（バンザイのときだけ見える）
  const arm = (hand, color) => {
    const sh = { x: bx - 8, y: 200 + by };
    c2.lineCap = 'round';
    c2.strokeStyle = INK; c2.lineWidth = 21; c2.beginPath(); c2.moveTo(sh.x, sh.y); c2.lineTo(hand.x, hand.y); c2.stroke();
    c2.strokeStyle = color; c2.lineWidth = 15; c2.beginPath(); c2.moveTo(sh.x, sh.y); c2.lineTo(hand.x, hand.y); c2.stroke();
    ellipse(hand.x, hand.y, 10, 10); fillStroke(SKIN);
  };
  if (o.arms > 0.05) arm({ x: lerp(bx + 30, bx - 16, o.arms), y: lerp(258, 108 + by, o.arms) }, suitDark);
  // 胴体
  rr(bx - 32, 180 + by, 50, 100, 22); fillStroke(suit);
  if (o.teacher) {
    // スタンドカラーと前立てのボタン
    rr(bx - 14, 172 + by, 26, 14, 5); fillStroke(suit, 2.5);
    c2.strokeStyle = 'rgba(58,42,42,.45)'; c2.lineWidth = 2;
    c2.beginPath(); c2.moveTo(bx + 6, 186 + by); c2.lineTo(bx + 6, 272); c2.stroke();
    c2.fillStyle = '#8a7c62';
    for (const y of [198, 220, 242]) { ellipse(bx + 10, y + by, 2.2, 2.2); c2.fill(); }
  } else {
    c2.strokeStyle = '#fff'; c2.lineWidth = 3;
    c2.beginPath(); c2.moveTo(bx - 7, 190 + by); c2.lineTo(bx - 7, 272); c2.stroke();
  }
  drawLeg(cx, by, ankle('R'), pants, o.shoes.R, COLORS.R, false);
  arm({ x: lerp(bx + 40, bx + 8, o.arms), y: lerp(256, 106 + by, o.arms) }, suit);
  // 頭（右向き）
  const hx = bx - 4, hy = 142 + by;
  ellipse(hx, hy, 35, 35); fillStroke(SKIN);
  ellipse(hx + 33, hy + 5, 6, 6); fillStroke(SKIN);
  c2.fillStyle = SKIN; ellipse(hx + 28, hy + 5, 5, 7); c2.fill();
  if (o.teacher) {
    // ふんわりした黒髪。前髪がおでこにかかる
    c2.beginPath();
    c2.moveTo(hx - 24, hy + 16);
    c2.arc(hx, hy, 38, Math.PI * 0.8, Math.PI * 1.2);
    c2.quadraticCurveTo(hx - 28, hy - 46, hx - 12, hy - 43);
    c2.quadraticCurveTo(hx - 2, hy - 53, hx + 10, hy - 43);
    c2.quadraticCurveTo(hx + 30, hy - 43, hx + 34, hy - 25);
    c2.quadraticCurveTo(hx + 41, hy - 14, hx + 33, hy - 10);
    c2.quadraticCurveTo(hx + 28, hy - 16, hx + 22, hy - 10);
    c2.quadraticCurveTo(hx + 16, hy - 18, hx + 10, hy - 11);
    c2.quadraticCurveTo(hx + 4, hy - 18, hx - 2, hy - 12);
    c2.quadraticCurveTo(hx - 12, hy - 4, hx - 14, hy + 8);
    c2.closePath(); fillStroke('#2a2420');
  } else {
    c2.beginPath(); c2.arc(hx, hy, 35, Math.PI * 0.8, Math.PI * 1.8); c2.quadraticCurveTo(hx + 6, hy - 14, hx - 26, hy + 10); c2.closePath(); fillStroke('#6b4226');
    c2.strokeStyle = INK; c2.lineWidth = 3; c2.beginPath(); c2.moveTo(hx - 2, hy - 35); c2.quadraticCurveTo(hx + 6, hy - 52, hx + 14, hy - 44); c2.stroke();
  }
  ellipse(hx - 8, hy + 4, 7, 9); fillStroke(SKIN, 2);
  drawFace(hx, hy, o.teacher && (o.face === 'normal' || o.face === 'happy') ? 'grin' : o.face);
  if (o.teacher) {
    // 細いフレームのメガネ
    c2.strokeStyle = '#5c5a58'; c2.lineWidth = 2.5; c2.lineCap = 'round';
    c2.beginPath(); c2.moveTo(hx + 8, hy - 6); c2.lineTo(hx - 6, hy - 3); c2.stroke();
    rr(hx + 7, hy - 11, 19, 14, 4); c2.fillStyle = 'rgba(200,230,255,.35)'; c2.fill(); c2.stroke();
    c2.beginPath(); c2.moveTo(hx + 26, hy - 6); c2.lineTo(hx + 31, hy - 5); c2.stroke();
  }
}

function drawFace(x, y, f) {
  const ex = x + 16, ey = y - 3, mx = x + 22, my = y + 15;
  c2.strokeStyle = INK; c2.fillStyle = INK; c2.lineWidth = 3; c2.lineCap = 'round';
  if (f === 'grin') {
    // 目を細めて歯を見せる笑顔
    c2.beginPath(); c2.arc(ex, ey + 1, 5, Math.PI * 1.1, Math.PI * 1.9); c2.stroke();
    c2.beginPath(); c2.moveTo(mx - 10, my - 5); c2.quadraticCurveTo(mx, my + 12, mx + 11, my - 6); c2.closePath();
    c2.fillStyle = '#fff'; c2.fill(); c2.stroke();
    c2.lineWidth = 1.5; c2.beginPath(); c2.moveTo(mx - 7, my - 1); c2.lineTo(mx + 8, my - 2); c2.stroke();
  } else if (f === 'happy') {
    c2.beginPath(); c2.arc(ex, ey + 2, 6, Math.PI * 1.1, Math.PI * 1.9); c2.stroke();
    c2.beginPath(); c2.arc(mx, my - 2, 8, 0, Math.PI); c2.closePath(); c2.fillStyle = '#c0392b'; c2.fill(); c2.stroke();
  } else if (f === 'sad') {
    c2.beginPath(); c2.moveTo(ex - 5, ey - 4); c2.lineTo(ex + 5, ey + 4); c2.moveTo(ex + 5, ey - 4); c2.lineTo(ex - 5, ey + 4); c2.stroke();
    c2.beginPath(); c2.arc(mx, my + 8, 7, Math.PI * 1.2, Math.PI * 1.8); c2.stroke();
    c2.fillStyle = '#7fd0ff'; c2.beginPath(); c2.moveTo(x - 20, y - 26); c2.quadraticCurveTo(x - 12, y - 12, x - 20, y - 10); c2.quadraticCurveTo(x - 28, y - 12, x - 20, y - 26); c2.fill(); c2.stroke();
  } else if (f === 'strain') {
    c2.beginPath(); c2.moveTo(ex - 6, ey); c2.lineTo(ex + 6, ey); c2.stroke();
    c2.beginPath(); for (let i = 0; i <= 4; i++) c2.lineTo(mx - 8 + i * 4, my + (i % 2 ? 3 : -3)); c2.stroke();
  } else {
    ellipse(ex, ey, 3.5, 5.5); c2.fill();
    c2.beginPath(); c2.arc(mx - 2, my - 4, 7, Math.PI * 0.2, Math.PI * 0.75); c2.stroke();
  }
  c2.fillStyle = 'rgba(255,120,120,.45)'; ellipse(x + 10, y + 10, 6, 4); c2.fill();
}

function bubble(x, y, text, color) {
  c2.font = '900 24px "Hiragino Maru Gothic ProN","Hiragino Sans","Yu Gothic UI",sans-serif';
  const w = c2.measureText(text).width + 30;
  rr(x - w / 2, y - 22, w, 44, 20); fillStroke('#fff');
  c2.beginPath(); c2.moveTo(x - 8, y + 21); c2.lineTo(x - 2, y + 36); c2.lineTo(x + 10, y + 21); c2.closePath(); c2.fillStyle = '#fff'; c2.fill();
  c2.strokeStyle = INK; c2.beginPath(); c2.moveTo(x - 8, y + 23); c2.lineTo(x - 2, y + 36); c2.lineTo(x + 10, y + 23); c2.stroke();
  c2.fillStyle = color; c2.textAlign = 'center'; c2.textBaseline = 'middle'; c2.fillText(text, x, y + 1);
}
function outlined(text, x, y, size, color, align = 'center') {
  c2.font = `900 ${size}px "Hiragino Maru Gothic ProN","Hiragino Sans","Yu Gothic UI",sans-serif`;
  c2.textAlign = align; c2.textBaseline = 'middle';
  c2.lineJoin = 'round'; c2.lineWidth = size / 5; c2.strokeStyle = INK; c2.strokeText(text, x, y);
  c2.fillStyle = color; c2.fillText(text, x, y);
}

function drawBackground(now, s, cy, pulse) {
  const floorY = cy + (330 - 230) * s;
  c2.fillStyle = '#ffcf5a'; c2.fillRect(0, 0, W, floorY);
  // 拍に合わせて弾む水玉
  c2.fillStyle = 'rgba(255,255,255,.28)';
  const gap = 90 * s, r = (16 + pulse * 7) * s;
  const off = ((now * 20) % 90) * s;
  for (let y = -gap; y < floorY + gap; y += gap) for (let x = -gap; x < W + gap; x += gap) {
    const ox = ((Math.round(y / gap) % 2) ? gap / 2 : 0) + off;
    ellipse(x + ox, y + off * 0.5, r, r); c2.fill();
  }
  c2.fillStyle = '#e8a35c'; c2.fillRect(0, floorY - 12 * s, W, 12 * s);
  c2.fillStyle = '#d0904f'; c2.fillRect(0, floorY, W, H - floorY);
  c2.strokeStyle = 'rgba(0,0,0,.1)'; c2.lineWidth = 2;
  for (let i = 1; i < 8; i++) { const y = floorY + i * 22 * s; c2.beginPath(); c2.moveTo(0, y); c2.lineTo(W, y); c2.stroke(); }
}

function drawStrip(bar, frac, now) {
  const w = 360, x0 = VIEW_CX - w / 2, y = 420;
  rr(x0, y - 20, w, 40, 20); c2.fillStyle = 'rgba(58,42,42,.55)'; c2.fill();
  for (let i = 0; i < 8; i++) {
    const sx = x0 + 22.5 + i * 45;
    c2.fillStyle = 'rgba(255,255,255,.35)'; ellipse(sx, y, i % 2 ? 2.5 : 4.5, i % 2 ? 2.5 : 4.5); c2.fill();
  }
  if (!bar || (bar.kind !== 'call' && bar.kind !== 'resp')) return;
  for (let i = 0; i < 8; i++) {
    const ev = bar.ev[i]; if (!ev) continue;
    const sx = x0 + 22.5 + i * 45;
    if (bar.kind === 'call' && now < bar.t + i * SLOT) continue;
    const isShoe = ev.type === 'S';
    let fill = COLORS[isShoe ? ev.side : ev.type], ring = INK, alpha = 1;
    if (bar.kind === 'resp') {
      const n = bar.notes[i];
      const res = !n ? null : !isShoe ? n.res
        : (n.res === 'miss' || n.next.res === 'miss') ? 'miss'
        : (n.res && n.next.res) ? (n.res === 'perfect' && n.next.res === 'perfect' ? 'perfect' : 'good') : null;
      if (ev.type === 'F') alpha = 0.45;
      else if (res === 'perfect') ring = '#ffcc00';
      else if (res === 'good') ring = '#3ccf6e';
      else if (res === 'miss') { fill = '#666'; ring = '#ff4d4d'; }
      else alpha = 0.75;
    }
    c2.globalAlpha = alpha;
    // トトンの2打目
    if (isShoe) { ellipse(sx + 22.5, y, 7, 7); c2.fillStyle = fill; c2.fill(); c2.lineWidth = 3; c2.strokeStyle = ring; c2.stroke(); }
    ellipse(sx, y, 15, 15); c2.fillStyle = fill; c2.fill(); c2.lineWidth = ring === INK ? 3 : 5; c2.strokeStyle = ring; c2.stroke();
    c2.fillStyle = '#fff'; c2.font = '900 15px sans-serif'; c2.textAlign = 'center'; c2.textBaseline = 'middle';
    c2.fillText(isShoe ? (ev.act === 'off' ? '脱' : '履') : ICON[ev.type], sx, y + 1);
    // のせる／おろす の矢印
    if (ev.dir) { c2.fillStyle = fill; c2.font = '900 11px sans-serif'; c2.fillText(ev.dir === 'up' ? '▲' : '▼', sx, ev.dir === 'up' ? y - 25 : y + 26); }
    c2.globalAlpha = 1;
  }
  const px = x0 + 8 + frac * (w - 16);
  c2.strokeStyle = '#fff'; c2.lineWidth = 3; c2.beginPath(); c2.moveTo(px, y - 24); c2.lineTo(px, y + 24); c2.stroke();
}

function teacherState(g, now) {
  const st = { L: 'down', R: 'down' }, from = { L: null, R: null }, k = { L: 99, R: 99 };
  for (const m of g.tMoves) {
    const s = m.t - 0.08;   // 拍ちょうどに棚へ着くよう少し早く動き出す
    if (s > now) break;
    from[m.side] = st[m.side]; st[m.side] = m.to; k[m.side] = (now - s) / MOVE_T;
  }
  const wig = { L: 0, R: 0 };
  for (const f of g.tFlicks) { if (f.t > now) break; wig[f.side] = Math.max(wig[f.side], bump(now - f.t, 0.1, 16)); }
  const shoes = { L: { on: true, k: 1 }, R: { on: true, k: 1 } };
  for (const e of g.tShoe) {
    if (e.t > now) break;
    shoes[e.side] = { on: e.act === 'on', act: e.act, k: (now - e.t) / 0.45 };
  }
  return { st, from, k, wig, shoes };
}

function frame() {
  requestAnimationFrame(frame);
  c2.setTransform(DPR, 0, 0, DPR, 0, 0);
  const g = game;
  const playing = g && ac && (g.state === 'play' || g.state === 'done');
  const now = playing ? audioNow() : performance.now() / 1000;

  if (g && g.state === 'play') {
    for (const n of g.notes) {
      if (n.t > now) break;
      if (!n.done && now - offsetMs / 1000 > n.t + GOOD) judgeMiss(n, 'ミス');
    }
    if (now > g.endT) finish();
  }

  const rel = playing ? now - g.t0 : now;
  const beatPh = ((rel / BEAT) % 1 + 1) % 1;
  const pulse = Math.exp(-beatPh * 6) * (playing && rel > 0 ? 1 : 0.4);
  const bi = playing ? Math.floor(rel / BAR) : -1;
  const bar = playing && bi >= 0 ? g.bars[bi] : null;
  const frac = playing ? ((rel / BAR) % 1 + 1) % 1 : 0;

  // キミの番が終わったら、足と靴をお手本どおりの状態にそろえる（失敗したとき用）
  if (g && g.state === 'play' && bi !== g.lastBi) {
    const pb = g.bars[bi - 1];
    if (pb && pb.kind === 'resp') for (const sd of ['L', 'R']) {
      if (g.shoe[sd] !== pb.endShoe[sd]) { g.shoe[sd] = pb.endShoe[sd]; g.shoeAnim[sd] = { act: pb.endShoe[sd] ? 'on' : 'off', at: now }; }
      moveFoot(sd, pb.endFoot[sd], now);
    }
    g.lastBi = bi;
  }

  const s = Math.min(W / 600, H / 460), cy = H / 2;
  drawBackground(rel, s, cy, pulse);
  c2.setTransform(DPR * s, 0, 0, DPR * s, DPR * (W / 2 - VIEW_CX * s), DPR * (cy - 230 * s));

  let tAnk, pAnk, tShoes, pShoes, shake = 0, bub = null;
  let tArms = 0, pArms = 0, pFace = 'normal', tFace = 'normal';
  const onShoe = { on: true, k: 1 };
  if (playing) {
    const ts = teacherState(g, now);
    for (const e of g.tEvents) {
      const dt = now - e.t;
      if (dt < -0.5) break;
      if (e.ev.type === 'F' && dt >= 0 && dt < 0.32) shake = Math.sin(dt * 90) * 4;
      if (dt >= 0 && dt < 0.4) bub = e.ev;
    }
    const trem = shake ? Math.abs(shake) * 1.5 : 0;
    tAnk = { L: anklePos(ts.st.L, ts.from.L, ts.k.L, ts.wig.L + trem), R: anklePos(ts.st.R, ts.from.R, ts.k.R, ts.wig.R + trem) };
    tShoes = ts.shoes;
    if (shake) tFace = 'strain';
    else if (ts.k.L < 2.5 || ts.k.R < 2.5) tFace = 'happy';
    const pa = sd => {
      const m = g.move[sd];
      const wig = bump(now - g.twitch[sd], 0.2, 12) + bump(now - g.flick[sd], 0.1, 16);
      return anklePos(g.foot[sd], m && m.from, m ? (now - m.at) / MOVE_T : 1, wig);
    };
    pAnk = { L: pa('L'), R: pa('R') };
    pShoes = {};
    for (const sd of ['L', 'R']) { const a = g.shoeAnim[sd]; pShoes[sd] = { on: g.shoe[sd], act: a && a.act, k: a ? (now - a.at) / 0.45 : 1 }; }
    if (performance.now() < g.face.until) pFace = g.face.type;
    if (now > g.poseT) {
      tAnk = pAnk = { L: ANKLE.up, R: ANKLE.up };
      tArms = pArms = 1; tFace = 'happy';
      pFace = g.state === 'done' && g.pct < 50 ? 'sad' : 'happy';
    }
  } else {
    // タイトル中は待機アニメ：左→右→左→右 と棚にのせておろす
    const ph = Math.floor(now / BEAT) % 4, k = (now % BEAT) / MOVE_T;
    const Ls = ph < 2 ? 'up' : 'down', Rs = ph === 1 || ph === 2 ? 'up' : 'down';
    const Lf = ph === 0 ? 'down' : ph === 2 ? 'up' : null, Rf = ph === 1 ? 'down' : ph === 3 ? 'up' : null;
    tAnk = pAnk = { L: anklePos(Ls, Lf, k, 0), R: anklePos(Rs, Rf, k, 0) };
    tShoes = pShoes = { L: onShoe, R: onShoe };
  }

  // スポットライト
  c2.fillStyle = 'rgba(255,255,220,.45)';
  if (bar && bar.kind === 'call') { ellipse(TEACHER_X + 50, 362, 140, 18); c2.fill(); }
  if (bar && bar.kind === 'resp') { ellipse(PLAYER_X + 50, 362, 140, 18); c2.fill(); }

  drawPerson(TEACHER_X, { teacher: true, ankles: tAnk, shoes: tShoes, shake, bounce: pulse, face: tFace, arms: tArms });
  drawPerson(PLAYER_X, { teacher: false, ankles: pAnk, shoes: pShoes, shake: 0, bounce: pulse, face: pFace, arms: pArms });

  outlined('せんせい', TEACHER_X, 384, 16, '#fff');
  outlined('キミ', PLAYER_X, 384, 16, '#fff');

  if (playing) {
    drawStrip(bar, frac, now);
    if (bub && !(now > g.poseT)) { const lb = cueLabel(bub); bubble(TEACHER_X + 20, 66, lb.text, lb.color); }
    let turn = '';
    if (bar) {
      if (bar.kind === 'call') turn = '♪ せんせいのお手本';
      else if (bar.kind === 'resp') turn = '★ キミの番！';
      else if (bar.kind === 'intro') turn = 'いくよ〜';
      else if (bar.kind === 'count') turn = ['1', '2', '3', '4'][Math.floor(frac * 4)];
      else turn = 'フィニッシュ！';
    }
    if (turn) outlined(turn, VIEW_CX, 24, 22, bar && bar.kind === 'resp' ? '#ffe14d' : '#fff');
    if (g.combo >= 3) outlined(g.combo + ' COMBO', 720, 24, 18, '#ffe14d', 'right');
    // レッスンのお知らせ
    for (const m of g.msgs) {
      const dt = now - m.t;
      if (dt >= 0 && dt < BAR) {
        c2.globalAlpha = Math.min(1, dt * 6, (BAR - dt) * 5);
        outlined(m.text, VIEW_CX, 62 - (1 - Math.min(1, dt * 6)) * 20, 26, '#ff6b9a');
        c2.globalAlpha = 1;
      }
    }
    // 判定ポップアップ
    const pn = performance.now();
    g.pops = g.pops.filter(p => pn - p.at < 650);
    for (const p of g.pops) {
      const k = (pn - p.at) / 650;
      c2.globalAlpha = 1 - k * k;
      outlined(p.text, p.x, p.y - k * 30, 28, p.color);
      c2.globalAlpha = 1;
    }
  }
}
requestAnimationFrame(frame);
</script>
</body>
</html>
